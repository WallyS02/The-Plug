apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: plug-namespace
  labels:
    plug: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      plug: backend-pods
  template:
    metadata:
      labels:
        plug: backend-pods
    spec:
      containers:
      - name: backend-container
        image: theplug.azurecr.io/latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
        envFrom:
          - configMapRef:
              name: backend-config-map
          - secretRef:
              name: backend-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2048Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /api/herb/list/  
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/herb/list/
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/herb/list/
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kv-provider"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1