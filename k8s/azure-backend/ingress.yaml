apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plug-ingress
  namespace: plug-namespace
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  ingressClassName: nginx
  rules:
  - host: theplug.software
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080